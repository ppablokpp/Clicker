<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>ClankUp App Store frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600&display=swap" />
<style>
  /* One App Store screenshot: 660×1434 css, captured at 2x → 1320×2868,
     the 6.9" size App Store Connect asks for. Same design as frame.html
     (Play, 1080×1920), re-proportioned: Apple's frame is far taller and a
     little wider, so the phone grows and the copy gets more air above it
     rather than everything being stretched.

     The phone's screen is cut to the captures' own aspect (393×852, an
     iPhone's) so `cover` crops nothing — a store screenshot that loses its
     own edges looks like a mistake. The whole device is in frame, standing
     on its own shadow: at this size the screen is still the biggest thing
     on the slide, and a phone cut off by the edge reads as a crop rather
     than as a phone.

     The design is laid out once at 660×1434 and scaled to whatever page
     size is asked for, because App Store Connect wants a separate set per
     device class (6.9" is 1320×2868, 6.5" is 1242×2688) and their aspects
     differ by less than half a percent. Scaling one design beats keeping
     two that drift apart; a couple of pixels come off the bottom on the
     shorter one, where there is nothing but sky.

     Query: shot, kicker, title, accent, glow, tilt, foot, pad, w, h. */
  html, body { margin: 0; overflow: hidden; background: #0b0716; }
  .slide { position: relative; width: 660px; height: 1434px; overflow: hidden; background: #0b0716; font-family: Inter, sans-serif; color: #f5f1ff; transform-origin: top left; }
  .sky { position: absolute; inset: -40px; background: url("splash.png") center/2000px 2000px; opacity: 0.9; }
  .glow { position: absolute; left: 50%; top: 60%; width: 1250px; height: 1250px; transform: translate(-50%, -50%);
          background: radial-gradient(circle, var(--accent-glow) 0%, transparent 55%); }
  .copy { position: absolute; left: 52px; right: 52px; top: 96px; }
  .kicker { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 16px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--accent); }
  .kicker::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); margin-right: 14px; vertical-align: 1px; }
  .title { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 58px; line-height: 1.04; letter-spacing: -0.03em; margin-top: 18px; text-wrap: balance; text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 48px var(--accent-glow); }
  .phone { position: absolute; left: 50%; top: 320px; width: 496px; height: 1045px; transform: translateX(-50%) rotate(var(--tilt, 0deg));
           border-radius: 60px; background: #06040c; padding: 13px;
           box-shadow: 0 0 0 2px #2a2138, 0 0 0 5px #0a0812, 0 40px 90px rgba(0,0,0,.7), 0 0 90px var(--accent-glow); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #08080c; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .island { position: absolute; left: 50%; top: 13px; width: 150px; height: 44px; border-radius: 22px; background: #000;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); transform: translateX(-50%); }
  .rim { position: absolute; inset: 0; border-radius: 50px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); pointer-events: none; }
  .floor { position: absolute; left: 50%; bottom: 38px; width: 560px; height: 90px; transform: translateX(-50%);
           background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.65), transparent 70%); filter: blur(2px); }
  .scan { position: absolute; inset: 0; opacity: 0.045; background: repeating-linear-gradient(180deg, #fff 0 1px, transparent 1px 4px); pointer-events: none; }
  .foot { position: absolute; left: 52px; bottom: 34px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(245,241,255,.35); }

  /* The 13" iPad slot (2064×2752). A different shape, not the phone
     design stretched: the canvas is 3:4 rather than 1:2.2, so the copy
     gets a wider column and more air, and the device in it is a tablet
     holding a real tablet capture — App Store review expects the iPad
     shot to show the app as an iPad runs it. No island: iPads have none. */
  .pad .copy { left: 96px; right: 96px; top: 104px; }
  .pad .kicker { font-size: 19px; letter-spacing: 0.32em; }
  .pad .title { font-size: 76px; margin-top: 22px; }
  .pad .glow { top: 62%; width: 1600px; height: 1600px; }
  .pad .sky { background-size: 2600px 2600px; }
  .pad .phone { top: 320px; width: 760px; height: 1003px; border-radius: 40px; padding: 16px; }
  .pad .screen, .pad .rim { border-radius: 26px; }
  .pad .island { display: none; }
  .pad .floor { bottom: 20px; width: 880px; height: 120px; }
  .pad .foot { left: 96px; bottom: 44px; font-size: 15px; }
</style>
</head>
<body>
<div class="slide" id="slide">
  <div class="sky"></div>
  <div class="glow"></div>
  <div class="copy">
    <div class="kicker" id="kicker"></div>
    <div class="title" id="title"></div>
  </div>
  <div class="floor"></div>
  <div class="phone">
    <div class="screen"><img id="shot" alt="" /><div class="island"></div><div class="rim"></div></div>
  </div>
  <div class="scan"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  document.getElementById('shot').src = q.get('shot')
  document.getElementById('kicker').textContent = q.get('kicker') || ''
  document.getElementById('title').textContent = q.get('title') || ''
  document.getElementById('foot').textContent = q.get('foot') || 'ClankUp'
  const s = document.getElementById('slide')
  // The page is whatever size was asked for; the design scales into it.
  const w = Number(q.get('w') || 660)
  const h = Number(q.get('h') || 1434)
  document.documentElement.style.width = document.body.style.width = w + 'px'
  document.documentElement.style.height = document.body.style.height = h + 'px'
  if (q.get('pad')) {
    s.classList.add('pad')
    s.style.width = w + 'px'
    s.style.height = h + 'px'
  } else if (w !== 660) {
    s.style.transform = 'scale(' + w / 660 + ')'
  }
  s.style.setProperty('--accent', q.get('accent') || '#a78bfa')
  s.style.setProperty('--accent-glow', q.get('glow') || 'rgba(167,139,250,.35)')
  s.style.setProperty('--tilt', q.get('tilt') || '0deg')
</script>
</body>
</html>
