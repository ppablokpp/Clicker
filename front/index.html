<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08080c" />
    <meta name="description" content="ClankUp — haz click, sube en la clasificación mundial." />
    <!-- iOS ignores the manifest's own display:standalone, so "Add to Home
         Screen" needs these to open chromeless instead of as a Safari tab.
         status-bar-style is deliberately "default" (opaque), not
         "black-translucent" — translucent draws the page content underneath
         the status bar/notch via viewport-fit=cover, and nothing here pads
         for env(safe-area-inset-top), so the top of the screen gets covered
         by the status bar instead of just scrolling under it like it did in
         Safari's own chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClankUp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ClankUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
